<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>T.H.I.S. Digital</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="prompt-bar">
        <span id="stage-label">Stage: warmup</span>
        <span id="letter-label">Trace: b</span>
        <button id="next-btn" disabled>Next</button>
      </div>
      <canvas id="trace-canvas"></canvas>
      <div id="debug-panel">
        <span id="stroke-count">Strokes: 0</span>
        <span id="point-count">Last stroke points: 0</span>
        <button id="clear-btn">Clear</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
