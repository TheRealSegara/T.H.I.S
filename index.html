<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>T.H.I.S. Digital</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="pupil-gate">
        <label for="pupil-input">Pupil name</label>
        <input id="pupil-input" type="text" placeholder="e.g. Ali" autocomplete="off" />
        <button id="pupil-start-btn">Start session</button>
      </div>
      <div id="session-view" hidden>
        <div id="practice-view">
          <div id="prompt-bar">
            <span id="stage-label">Stage: warmup</span>
            <span id="letter-label">Trace: b</span>
            <button id="next-btn" disabled>Next</button>
          </div>
          <canvas id="trace-canvas"></canvas>
          <div id="debug-panel">
            <span id="stroke-count">Strokes: 0</span>
            <span id="point-count">Last stroke points: 0</span>
            <button id="clear-btn">Clear</button>
          </div>
        </div>
        <div id="summary-view" hidden>
          <h1>Session Summary</h1>
          <ul id="summary-list"></ul>
          <button id="new-session-btn">Start another session</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
